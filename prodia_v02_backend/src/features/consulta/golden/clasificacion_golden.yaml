  esperado: desconocido

# ⚠️ DEUDA CONOCIDA — NO-DETERMINISMO DEL LLM (hallazgo posterior al plan, mismo día). qwen2.5:3b
# con temperature=0 NO es estable en esta frase: 5 llamadas repetidas dieron cuantificar 1/5 y
# desconocido 4/5, todas con diag=None (respondió bien, solo que distinto cada vez). Es una
# naturaleza DISTINTA a la deuda D5 de abajo (esa falla siempre igual; esta es intermitente —
# puede pasar el gate una corrida y fallar la siguiente sin que nada haya cambiado). Se registra
# con la etiqueta CORRECTA (cuantificar), nunca se omite ni se invierte. Vía de cierre: la misma
# de D5 (afinar el prompt de Capa 2, o medir si gemma4 en 139 es más estable).
- pregunta: "¿Cuántos campos hay en total?"
  esperado: cuantificar

# ⚠️ DEUDA CONOCIDA Y MEDIDA (D5) — ESTE CASO FALLA HOY, A PROPÓSITO ESTÁ AQUÍ.
# El LLM (qwen2.5:3b) clasifica esta pregunta legítima de producción como 'desconocido'. Es el
# precio de la escalada: 2 casos arreglados por 1 roto (ganancia neta +1). Se registra con su
# etiqueta CORRECTA (analizar) para que la deuda quede VISIBLE en cada corrida del gate — NO se
# etiqueta al revés ni se omite, eso corrompería el examen. Vías de cierre (fuera de alcance de
# este plan): afinar el prompt de Capa 2 para que sepa que campos/pozos/activos son entidades de
# producción, o verificar si gemma4 en 139 sí acierta.
- pregunta: "¿Qué campos están por debajo de la meta?"
  esperado: analizar

# ---- [2026-08-02 · 2ª tanda de trampas en vivo, calificadas por el usuario (Control 3)] --------
# 5 preguntas que reusan una FORMA o palabra real del clasificador sobre un tema AJENO. Todas
# deben caer en desconocido. Estado tras el análisis (verificado contra el código):
#   · caída del cabello  → regex+filtro → OUT (ya acertaba).
#   · pozos del ajedrez   → regex+LLM (estructural) → OUT (ya acertaba; el LLM lo confirma).
#   · campos del formulario → capa1 no atrapa → Capa 2. qwen dio JERARQUIZAR; se endureció el
#       prompt de Capa 2 (polisemia campos/pozos/activos/cierre). MODEL-DEPENDENT: puede fallar
#       con qwen; verificar paridad gemma4.
#   · cómo vamos con la meta de pasos → ARREGLADO: se retiró la ancla 'COMO VAMOS' (patrones_grupo
#       .yaml). Ahora pasa por el filtro → sin entidad ni vocabulario → OUT.
#   · proyección de cierre de la bolsa → LÍMITE ACEPTADO (decisión del usuario 2026-08-02, opción
#       A). 'cierre' es vocabulario FUERTE porque protege "¿Cuál es la proyección de cierre de
#       mayo?" (arriba, analizar) de forma DETERMINISTA; "cierre de la bolsa" reusa la misma
#       palabra. Se prefiere esa certeza a atrapar una colisión rara en un chat de producción.
#       Queda como fallo VISIBLE del gate A PROPÓSITO — no se va a "arreglar" (misma lógica que D5).
- pregunta: "¿A qué se debe la caída del cabello?"
  esperado: desconocido
- pregunta: "¿Cuántos pozos tiene el ajedrez?"
  esperado: desconocido
- pregunta: "¿Qué campos debo llenar en el formulario?"
  esperado: desconocido
- pregunta: "¿Cómo vamos con la meta de pasos diarios?"
  esperado: desconocido
- pregunta: "¿Cuál es la proyección de cierre de la bolsa hoy?"
  esperado: desconocido

